[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-toolkit"
version = "0.2.0"
description = "Agent-led resume and cover-letter workflows with evidence validation and document tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.7",
  "pypdf>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
visual = ["PyMuPDF>=1.24.3"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
cv = "cv_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_toolkit = ["assets/*.css", "assets/*.html", "assets/examples/*/*", "assets/hook/*", "assets/skills/*/*.md", "assets/skills/*/references/*.md", "assets/skills/*/references/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

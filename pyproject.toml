[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-toolkit"
version = "0.1.0"
description = "Agent-led resume and cover-letter workflows with evidence validation and document tools"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.7",
  "pypdf>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cv = "cv_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_toolkit = ["assets/*.css", "assets/*.html", "assets/examples/*/*", "assets/skills/*/*.md", "assets/skills/*/references/*.md", "assets/skills/*/references/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
